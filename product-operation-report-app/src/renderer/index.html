<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 开发模式需要 unsafe-inline（Vite React-refresh 预置脚本）与 ws（HMR）。
         模型 API 调用发生在主进程，不受此 connect-src 限制；生产可进一步收紧。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:"
    />
    <link rel="icon" type="image/svg+xml" href="/src/assets/product-logo.svg" />
    <title>产品经营报告</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
