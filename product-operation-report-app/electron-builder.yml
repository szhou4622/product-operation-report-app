appId: com.example.product-operation-report
productName: 产品经营报告
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - assets/**/*
  - package.json
asarUnpack:
  - assets/**/*
# 发布流程从私有构建变量生成该文件；它被 Git 忽略，不能提交真实 API Key。
extraResources:
  - from: managed-model.json
    to: managed-model.json
afterPack: build/afterPack.cjs
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
mac:
  icon: build/icon.png
  artifactName: Product-Operation-Report-macOS-${version}-${arch}.${ext}
  minimumSystemVersion: "12.0"
  identity: "-"
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
  category: public.app-category.productivity
win:
  icon: build/icon.ico
  signAndEditExecutable: false
  target:
    - nsis
nsis:
  artifactName: Product-Operation-Report-Windows-${version}-${arch}-Setup.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  oneClick: false
  allowToChangeInstallationDirectory: true
